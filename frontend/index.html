<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend de Tareas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>App de Tareas</h1>
      <p>Frontend simple para tu backend con JWT</p>
    </header>

    <div id="messages" class="messages"></div>

    <section id="auth-section">
      <div class="card">
        <h2>Registrar usuario</h2>
        <form id="register-form">
          <input type="text" name="username" placeholder="Usuario" required />
          <input type="password" name="password" placeholder="Contraseña" required />
          <button type="submit">Registrar</button>
        </form>
      </div>

      <div class="card">
        <h2>Iniciar sesión</h2>
        <form id="login-form">
          <input type="text" name="username" placeholder="Usuario" required />
          <input type="password" name="password" placeholder="Contraseña" required />
          <button type="submit">Ingresar</button>
        </form>
      </div>
    </section>

    <section id="app-section" class="hidden">
      <div class="card">
        <div class="card-header">
          <h2>Crear tarea</h2>
          <button id="logout-button" class="small-button">Cerrar sesión</button>
        </div>
        <form id="task-form">
          <input type="text" name="titulo" placeholder="Título" required />
          <textarea name="descripcion" placeholder="Descripción" required></textarea>
          <button type="submit">Guardar tarea</button>
        </form>
      </div>

      <div class="card">
        <h2>Mis tareas</h2>
        <ul id="task-list" class="task-list"></ul>
      </div>
    </section>

    <footer>
      <p>Usa este frontend con tu backend en <strong>http://localhost:5167</strong>.</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
